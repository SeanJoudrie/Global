<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <!-- Globalio app icon — matches the in-app EarthLogo (golden globe + clouds).
       Full-bleed cream background so it works as a maskable PWA / home-screen
       icon; artwork scaled slightly in for a safe margin under OS masks. -->
  <defs>
    <clipPath id="earthClip"><circle cx="60" cy="60" r="46"/></clipPath>
  </defs>

  <!-- Cream background (full bleed for maskable) -->
  <rect width="120" height="120" fill="#FBF4E4"/>

  <g transform="translate(60 60) scale(0.86) translate(-60 -60)">
    <!-- Cream planet body -->
    <circle cx="60" cy="60" r="46" fill="#F4E9D2"/>

    <!-- Golden-brown continents, clipped to the globe -->
    <g clip-path="url(#earthClip)">
      <path d="M 22,33 Q 30,24 52,28 Q 58,33 56,44 Q 51,52 45,59 Q 41,66 37,73 Q 32,68 34,62 Q 29,55 25,46 Q 21,40 22,33 Z" fill="#C0883C"/>
      <path d="M 26,20 Q 34,15 41,20 Q 42,27 33,27 Z" fill="#C0883C"/>
      <path d="M 37,71 Q 44,65 51,68 Q 54,80 51,92 Q 47,101 42,100 Q 35,97 32,84 Q 30,73 37,71 Z" fill="#C0883C"/>
      <path d="M 60,25 Q 68,20 77,25 Q 80,32 74,38 Q 65,39 61,33 Z" fill="#C0883C"/>
      <path d="M 56,42 Q 65,36 80,40 Q 85,53 83,70 Q 78,88 68,92 Q 58,92 53,80 Q 49,66 53,50 Z" fill="#C0883C"/>
      <path d="M 78,27 Q 89,21 100,28 Q 103,37 97,44 Q 88,45 80,39 Q 76,34 78,27 Z" fill="#C0883C"/>
    </g>

    <!-- Globe outline -->
    <circle cx="60" cy="60" r="46" fill="none" stroke="#6B4A23" stroke-width="4.5"/>

    <!-- Left cloud -->
    <path d="M 8,71 C 4,72 3,65 7,62 C 6,55 10,52 16,55 C 17,48 23,47 27,51 C 30,48 37,50 37,57 C 43,58 42,66 37,69 L 8,71 Z" fill="white" stroke="#6B4A23" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Right cloud -->
    <path d="M 83,57 C 81,58 80,52 84,50 C 83,44 89,42 94,46 C 97,40 104,41 106,46 C 111,43 114,51 110,54 C 113,59 83,58 83,57 Z" fill="white" stroke="#6B4A23" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
