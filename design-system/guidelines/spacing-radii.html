<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="From chips to hero cards — soft, never sharp" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); display: flex; gap: 14px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 78px; height: 60px; background: var(--surface-card); border: 1px solid var(--border-strong); box-shadow: var(--shadow-card); }
  .name { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: var(--text-strong); margin-top: 8px; }
  .val { font-family: var(--font-data); font-size: 9.5px; color: var(--text-muted); margin-top: 1px; }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="name">xs</div><div class="val">8px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="name">sm</div><div class="val">10px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="name">md</div><div class="val">12px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="name">lg</div><div class="val">14px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="name">xl</div><div class="val">16px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill);width:60px"></div><div class="name">pill</div><div class="val">999px</div></div>
</body>
</html>
