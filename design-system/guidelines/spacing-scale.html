<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="2px-based rhythm — relaxed, never cramped" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); display: flex; gap: 12px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: color-mix(in srgb, var(--accent-codex) 22%, transparent); border: 1px solid color-mix(in srgb, var(--accent-codex) 45%, transparent); border-radius: 3px; width: 100%; }
  .wrap { width: 30px; display: flex; align-items: flex-end; height: 64px; }
  .val { font-family: var(--font-data); font-size: 9.5px; color: var(--text-muted); }
  .name { font-family: var(--font-body); font-size: 9px; font-weight: 600; color: var(--text-strong); }
</style>
</head>
<body>
  <div class="item"><div class="wrap"><div class="bar" style="height:4px"></div></div><div class="name">2</div><div class="val">2</div></div>
  <div class="item"><div class="wrap"><div class="bar" style="height:8px"></div></div><div class="name">4</div><div class="val">4</div></div>
  <div class="item"><div class="wrap"><div class="bar" style="height:12px"></div></div><div class="name">6</div><div class="val">6</div></div>
  <div class="item"><div class="wrap"><div class="bar" style="height:16px"></div></div><div class="name">8</div><div class="val">8</div></div>
  <div class="item"><div class="wrap"><div class="bar" style="height:24px"></div></div><div class="name">12</div><div class="val">12</div></div>
  <div class="item"><div class="wrap"><div class="bar" style="height:32px"></div></div><div class="name">16</div><div class="val">16</div></div>
  <div class="item"><div class="wrap"><div class="bar" style="height:40px"></div></div><div class="name">20</div><div class="val">20</div></div>
  <div class="item"><div class="wrap"><div class="bar" style="height:48px"></div></div><div class="name">24</div><div class="val">24</div></div>
  <div class="item"><div class="wrap"><div class="bar" style="height:64px"></div></div><div class="name">32</div><div class="val">32</div></div>
</body>
</html>
