<!-- @dsCard group="Brand" viewport="700x186" name="Iconography · Lucide line" subtitle="Etched 1.6-stroke line icons, currentColor — never emoji" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); }
  .lbl { font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.14em; font-size: 8px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip { width: 46px; height: 46px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent); }
  svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <div class="lbl">Etched line icons · stroke 1.6 · currentColor</div>
  <div class="row">
    <span class="chip" style="--accent:var(--accent-learn);color:var(--accent-learn)"><i data-lucide="flag"></i></span>
    <span class="chip" style="--accent:var(--accent-learn);color:var(--accent-learn)"><i data-lucide="layers"></i></span>
    <span class="chip" style="--accent:var(--accent-codex);color:var(--accent-codex)"><i data-lucide="scroll-text"></i></span>
    <span class="chip" style="--accent:var(--accent-codex);color:var(--accent-codex)"><i data-lucide="book-open"></i></span>
    <span class="chip" style="--accent:var(--accent-play);color:var(--accent-play)"><i data-lucide="dna"></i></span>
    <span class="chip" style="--accent:var(--accent-play);color:var(--accent-play)"><i data-lucide="puzzle"></i></span>
    <span class="chip" style="--accent:var(--accent-play);color:var(--accent-play)"><i data-lucide="layout-grid"></i></span>
    <span class="chip" style="--accent:var(--accent-challenge);color:var(--accent-challenge)"><i data-lucide="swords"></i></span>
    <span class="chip" style="--accent:var(--accent-challenge);color:var(--accent-challenge)"><i data-lucide="trophy"></i></span>
    <span class="chip" style="--accent:var(--accent-codex);color:var(--accent-codex)"><i data-lucide="compass"></i></span>
    <span class="chip" style="--accent:var(--accent-today);color:var(--accent-today)"><i data-lucide="flame"></i></span>
    <span class="chip" style="--accent:var(--accent-learn);color:var(--accent-learn)"><i data-lucide="languages"></i></span>
    <span class="chip" style="--accent:var(--accent-play);color:var(--accent-play)"><i data-lucide="globe-2"></i></span>
  </div>
  <script>lucide.createIcons({ attrs: { "stroke-width": 1.6 } });</script>
</body>
</html>
