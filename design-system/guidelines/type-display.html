<!-- @dsCard group="Type" viewport="700x210" name="Display · Playfair Display" subtitle="The archive serif — wordmark, titles & card heroes" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); }
  .item { display: flex; align-items: baseline; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--border-hairline); }
  .item:last-child { border-bottom: 0; }
  .lbl { font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.14em; font-size: 8px; font-weight: 600; color: var(--text-muted); width: 96px; flex-shrink: 0; }
  .spec { font-family: var(--font-display); color: var(--text-strong); letter-spacing: -0.01em; line-height: 1.05; }
</style>
</head>
<body>
  <div class="item"><span class="lbl">Hero · 38</span><span class="spec" style="font-size:38px;font-weight:800">Globalio</span></div>
  <div class="item"><span class="lbl">Title · 24</span><span class="spec" style="font-size:24px;font-weight:700">Flag of the Day</span></div>
  <div class="item"><span class="lbl">Card · 22</span><span class="spec" style="font-size:22px;font-weight:700">Subdivision Stumper</span></div>
  <div class="item"><span class="lbl">Section · 18</span><span class="spec" style="font-size:18px;font-weight:600">Trace the family tree</span></div>
  <div class="item"><span class="lbl">Italic · 16</span><span class="spec" style="font-size:16px;font-weight:500;font-style:italic">From the archive</span></div>
</body>
</html>
