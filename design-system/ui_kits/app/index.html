<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Globalio · Chill Cartography</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    background:
      radial-gradient(120% 90% at 50% -10%, #E7DCC4, transparent 60%),
      #E3D8BF;
    font-family: var(--font-body);
  }
  .device {
    width: 414px;
    height: 826px;
    border-radius: 56px;
    background: #2A2622;
    padding: 12px;
    box-shadow: 0 40px 90px -30px rgba(31, 58, 60, 0.55), 0 4px 12px rgba(31, 58, 60, 0.25);
    flex-shrink: 0;
  }
  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 45px;
    overflow: hidden;
    background: var(--surface-page);
  }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 70;
    height: 30px; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 28px 0; pointer-events: none;
    font-family: var(--font-data); font-weight: 700; font-size: 13px; color: var(--text-strong);
  }
  .statusbar .dots { display: flex; align-items: center; gap: 5px; }
  .statusbar .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--text-strong); }
  #app { position: absolute; inset: 0; padding-top: 30px; }
  /* hide rail scrollbars for the chill, clean look */
  .gl-rail::-webkit-scrollbar, #app main::-webkit-scrollbar { height: 0; width: 0; }
  .gl-rail { scrollbar-width: none; }
  #app main { scrollbar-width: none; }
</style>
</head>
<body>
  <div class="device">
    <div class="screen">
      <div class="statusbar">
        <span>9:41</span>
        <span class="dots"><span></span><span></span><span></span></span>
      </div>
      <div id="app"></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
  <script src="../../assets/line-icon.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="data.js"></script>

  <script type="text/babel" src="TodayTab.jsx"></script>
  <script type="text/babel" src="PlayTab.jsx"></script>
  <script type="text/babel" src="LearnTab.jsx"></script>
  <script type="text/babel" src="CodexTab.jsx"></script>
  <script type="text/babel" src="YouTab.jsx"></script>
  <script type="text/babel" src="Shell.jsx"></script>
  <script type="text/babel">
    const App = window.GlobalioApp;
    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
