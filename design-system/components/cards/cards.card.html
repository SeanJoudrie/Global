<!doctype html>
<html>
<head>

<style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="../../assets/line-icon.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { ModuleCard, GameTile, HeroCard, FlagChip, Badge } = window.GlobalioDesignSystem_019dee;
const LineIcon = window.LineIcon;
const ic = (n, c) => <LineIcon name={n} size={21} color={c} />;

function Demo() {
  return (
    <div>
      <div className="group">
        <p className="lbl">ModuleCard · with progress & mastered foil</p>
        <div className="stack">
          <ModuleCard icon={ic('flags','var(--accent-learn)')} title="Flag Sets" subtitle="Country, historical & identity sets" accent="var(--accent-learn)" progress={{ done: 88, total: 195 }} />
          <ModuleCard icon={ic('codex','var(--accent-codex)')} title="The Codex" subtitle="Every country's flag history" accent="var(--accent-codex)" progress={{ done: 195, total: 195 }} />
          <ModuleCard icon={ic('gauntlet','var(--accent-challenge)')} title="Gauntlet" subtitle="One life · every flag" accent="var(--accent-challenge)" />
        </div>
      </div>
      <div className="group">
        <p className="lbl">GameTile · arcade</p>
        <div className="tiles">
          <GameTile icon={ic('flagle','var(--accent-play)')} title="Flagle" subtitle="Daily flag Wordle · 6 guesses" accent="var(--accent-play)" />
          <GameTile icon={ic('flagdna','var(--accent-play)')} title="Flag DNA" subtitle="Guess by attributes" accent="var(--accent-play)" />
          <GameTile icon={ic('silhouette','var(--accent-play)')} title="Silhouette" subtitle="Guess from the dark" accent="var(--accent-play)" />
          <GameTile icon={ic('language','var(--accent-play)')} title="Guess the Language" subtitle="82 languages" accent="var(--accent-play)" />
        </div>
      </div>
      <div className="group" style={{ marginBottom: 0 }}>
        <p className="lbl">HeroCard · Today</p>
        <HeroCard eyebrow="Flag of the Day" title="Brazil"
          subtitle="The green stands for its forests; the blue celestial globe carries 27 stars — one per state."
          accent="var(--accent-codex)" cta="Open codex"
          media={<FlagChip code="br" flagBase="../../assets/flags" w={104} h={70} />} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
