<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); }
  .lbl { font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.14em; font-size: 8px; font-weight: 600; color: var(--text-muted); margin: 0 0 10px; }
  .group { margin-bottom: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="../../assets/line-icon.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, Badge, Card } = window.GlobalioDesignSystem_019dee;
const LineIcon = window.LineIcon;

function Demo() {
  return (
    <div>
      <div className="group">
        <p className="lbl">Button · variants</p>
        <div className="row">
          <Button accent="var(--accent-play)" trailingArrow>Quick Play</Button>
          <Button variant="soft" accent="var(--accent-learn)">Learn more</Button>
          <Button variant="outline">Skip</Button>
          <Button variant="ghost" accent="var(--accent-codex)">Open codex</Button>
          <Button accent="var(--accent-play)" disabled>Disabled</Button>
        </div>
      </div>
      <div className="group">
        <p className="lbl">Button · sizes & accents</p>
        <div className="row">
          <Button size="sm" accent="var(--accent-challenge)">Small</Button>
          <Button size="md" accent="var(--accent-codex)" icon={<LineIcon name="flame" size={15} color="var(--text-on-accent)" />}>Streak</Button>
          <Button size="lg" accent="var(--accent-learn)" trailingArrow>Daily Expedition</Button>
        </div>
      </div>
      <div className="group">
        <p className="lbl">Badge</p>
        <div className="row">
          <Badge accent="var(--accent-codex)">Europe</Badge>
          <Badge accent="var(--accent-learn)" tone="outline">Africa</Badge>
          <Badge accent="var(--accent-success)" tone="solid">Complete</Badge>
          <Badge accent="var(--accent-play)" eyebrow>Today's Game</Badge>
        </div>
      </div>
      <div className="group" style={{ marginBottom: 0 }}>
        <p className="lbl">Card · paper stock (hover for wash)</p>
        <div className="row" style={{ alignItems: 'stretch' }}>
          <Card accent="var(--accent-play)" interactive style={{ width: 230 }}>
            <Badge accent="var(--accent-play)" eyebrow>Featured</Badge>
            <div className="gl-display" style={{ fontWeight: 700, fontSize: 18, marginTop: 6 }}>Flag DNA</div>
            <p className="gl-body" style={{ fontSize: 12, margin: '5px 0 0' }}>Guess the country from its colours, bands & symbols.</p>
          </Card>
          <Card accent="var(--accent-learn)" interactive style={{ width: 230 }}>
            <Badge accent="var(--accent-learn)" eyebrow>Curriculum</Badge>
            <div className="gl-display" style={{ fontWeight: 700, fontSize: 18, marginTop: 6 }}>Flashcards</div>
            <p className="gl-body" style={{ fontSize: 12, margin: '5px 0 0' }}>Swipe through all 195 country flags at your pace.</p>
          </Card>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
