<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Globalio — Learn Every Flag in the World</title>
    <meta name="description" content="A beautiful flag & geography game with 50+ ways to play — daily challenges, quizzes, and a 2,000-flag codex. Free to play, no sign-up." />
    <!-- Google AdSense — site verification + Auto ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2216954143093824" crossorigin="anonymous"></script>
    <link rel="canonical" href="https://globalio.app/" />
    <meta name="theme-color" content="#FBF4E4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Globalio" />

    <!-- Open Graph — how the link looks when shared (Messages, Discord, FB…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Globalio" />
    <meta property="og:url" content="https://globalio.app/" />
    <meta property="og:title" content="Globalio — Learn Every Flag in the World" />
    <meta property="og:description" content="A beautiful flag & geography game with 50+ ways to play — daily challenges, quizzes, and a 2,000-flag codex. Free to play." />
    <meta property="og:image" content="https://globalio.app/world-map.jpg" />
    <meta property="og:image:alt" content="Globalio — a world of flags" />

    <!-- Twitter / X large card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Globalio — Learn Every Flag in the World" />
    <meta name="twitter:description" content="A beautiful flag & geography game with 50+ ways to play. Free to play." />
    <meta name="twitter:image" content="https://globalio.app/world-map.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Country flags are self-hosted; identity/historical flags & CDN fallbacks
         live on these hosts — warm the connections early. -->
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <link rel="preconnect" href="https://commons.wikimedia.org" />
    <link rel="preconnect" href="https://flagcdn.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Tactical Geo-Codex type system: geometric display sans + monospaced data font -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Modern Cartographer type system: classic serif headers (archive feel) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <!-- Historic-script webfonts so ancient languages (cuneiform, hieroglyphs, Gothic, Coptic) render on every device -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Cuneiform&family=Noto+Sans+Egyptian+Hieroglyphs&family=Noto+Sans+Gothic&family=Noto+Sans+Coptic&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
